apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: retrogemini

resources:
  # Secrets are NOT included - create them manually BEFORE applying
  # See k8s/secrets-templates/ for example files
  - pvc.yaml
  - postgresql-deployment.yaml
  - postgresql-service.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - ingress.yaml
  # networkpolicy.yaml is DELIBERATELY NOT LISTED — it is opt-in, applied by
  # hand after checking that it can actually do anything in your namespace.
  # See k8s/README.md -> Network policies, and the header of the file itself.

commonLabels:
  app.kubernetes.io/part-of: retrogemini
  app.kubernetes.io/managed-by: kustomize
