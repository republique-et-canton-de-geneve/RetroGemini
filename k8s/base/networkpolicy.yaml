# Audit H46 - the network posture.
#
# SECURITY.md has recommended "use network policies to restrict pod-to-pod
# communication" for as long as it has existed, and the manifests shipped none:
# any pod in the cluster that could resolve `postgresql:5432` was free to try to
# connect to it.
#
# ⚠️ TWO THINGS TO CHECK BEFORE APPLYING THIS TO A LIVE INSTALLATION.
#
#  1. **Does your CNI enforce NetworkPolicy at all?** Calico, Cilium, OVN-Kubernetes
#     and OpenShift SDN do; plain flannel does not. A NetworkPolicy on a CNI that
#     ignores it is worse than none, because it reads as protection. Verify, then
#     roll this to a non-production project first.
#  2. **Is anything else running in this namespace?** The default-deny below
#     selects every pod in it, not only ours. In a project that holds this
#     application alone - which is what the rest of k8s/ assumes - that is the
#     point. In a shared namespace it takes the co-tenants off the network.
#
# INGRESS ONLY, DELIBERATELY. A default-deny that also covered egress and allowed
# only the two flows below would break the application in ways that do not look
# like a network problem: DNS goes first, so the pod could not even resolve
# `postgresql`, and then SMTP (invitations, password resets), Redis (the
# multi-pod Socket.IO adapter) and the LLM endpoint would each fail quietly,
# because each of them is optional. Restricting egress means enumerating kube-dns
# plus every endpoint an operator may configure later, and is a separate piece of
# work with its own rollout.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrogemini-default-deny-ingress
  labels:
    app: retrogemini
spec:
  # Every pod in the namespace, with no ingress rule: nothing may reach anything
  # unless a policy below says so. This is the floor that gives the two policies
  # after it their meaning - without it they would only add permissions to an
  # already-open network.
  podSelector: {}
  policyTypes:
    - Ingress
---
# The application answers HTTP on 8080, and this rule deliberately does not say
# from where.
#
# Naming the ingress controller's namespace would be tighter, but the selector
# for it differs per platform (`kubernetes.io/metadata.name: ingress-nginx`,
# `policy-group.network.openshift.io/ingress: ""`, ...) and an OpenShift router
# running with hostNetwork is not selectable by namespace at all - its traffic
# arrives from the node address. Getting that wrong takes the application off the
# network, which is a worse outcome than leaving port 8080 as reachable as it is
# today. Leaving the source open also keeps the kubelet's readiness, liveness and
# startup probes working on every CNI, since those arrive from the node too.
#
# The value is in the policy below this one; this one exists so the default-deny
# does not break the app. To tighten it, add a `from:` naming your own ingress
# controller and verify probes still pass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrogemini-allow-http
  labels:
    app: retrogemini
spec:
  podSelector:
    matchLabels:
      app: retrogemini
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# This is the finding. The database accepts connections from the application
# pods and from nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrogemini-postgresql-allow-app
  labels:
    app: postgresql-retrogemini
spec:
  podSelector:
    matchLabels:
      app: postgresql-retrogemini
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: retrogemini
      ports:
        - protocol: TCP
          port: 5432
