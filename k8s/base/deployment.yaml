apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrogemini
  labels:
    app: retrogemini
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: retrogemini
  template:
    metadata:
      labels:
        app: retrogemini
    spec:
      containers:
        - name: container
          # This line is rewritten by .github/workflows/docker-deploy.yml on every
          # deployment (sed + auto-commit), so it names the last tag pushed to the
          # registry. It had drifted 17 majors behind VERSION, i.e. it advertised
          # an image predating many user-visible releases;
          # __tests__/deploymentManifestParity.test.ts now fails when the majors
          # diverge again. Overlays may retag (see k8s/overlays/dev).
          image: jpfroud/retrogemini:27.29
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SUPER_ADMIN_PASSWORD
            # Stable token-signing secret. Optional so existing secrets still
            # start; if absent, tokens use a process-local random secret.
            - name: SESSION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SESSION_TOKEN_SECRET
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_HOST
            # SMTP configuration (optional - for email invitations and password reset)
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PASS
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: FROM_EMAIL
                  optional: true
            # Wi-Fi QR code configuration (optional - for air-gapped deployments)
            - name: WIFI_SSID
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_SSID
                  optional: true
            - name: WIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_PASSWORD
                  optional: true
            # Backup configuration (plain values - safe to re-apply)
            - name: BACKUP_ENABLED
              value: "true"
            - name: BACKUP_INTERVAL_HOURS
              value: "24"
            - name: BACKUP_MAX_COUNT
              value: "7"
            - name: BACKUP_ON_STARTUP
              value: "true"
            # Restore archive limits (MB). RESTORE_MAX_BODY_MB caps the uploaded
            # compressed body; RESTORE_MAX_DECOMPRESSED_MB caps expanded JSON.
            - name: RESTORE_MAX_BODY_MB
              value: "128"
            - name: RESTORE_MAX_DECOMPRESSED_MB
              value: "512"
            # Team-create / restore-session attempts allowed per IP per 15 min.
            # A whole office can share one NAT egress address, so raise this if
            # legitimate logins start being refused.
            - name: AUTH_RATE_LIMIT_MAX
              value: "5"
            # Scaling / performance tuning (optional - values below are the
            # built-in code defaults; adjust per environment as you grow).
            # PG_POOL_MAX is PER POD: keep (replicas x PG_POOL_MAX) safely below
            # the PostgreSQL max_connections (default 100). Here 2 x 10 = 20.
            - name: PG_POOL_MAX
              value: "10"
            # Max live sessions cached in memory per pod (bounds memory only;
            # session state is always recoverable from the database).
            - name: SESSION_CACHE_MAX
              value: "500"
            # Max Socket.IO message size in bytes (1 MB) - caps one session update.
            - name: SOCKET_MAX_BUFFER_SIZE
              value: "1000000"
            # Per-socket update-session flood throttle (token bucket). Disabled
            # by default (rate 0); enabling it is capacity-sensitive, so run the
            # load test at your real cadence first. Timer sync is ~1/s, so 20 is
            # a generous starting point. A throttled write is healed, not dropped.
            - name: SOCKET_UPDATE_RATE
              value: "0"
            - name: SOCKET_UPDATE_BURST
              value: "40"
            # Min interval (ms) between lastConnectionDate refreshes on join
            # (5 min) - avoids a write storm when a whole session reconnects.
            - name: LAST_CONNECTION_DEBOUNCE_MS
              value: "300000"
            # Debounce window (ms) for coalescing roster rebroadcasts. Caps a
            # reconnect stampede to one rebuild + broadcast per room per window
            # instead of one cross-pod fetchSockets() + broadcast per join
            # (audit R28). Never drops a user action; set to 0 to disable.
            - name: ROSTER_BROADCAST_DEBOUNCE_MS
              value: "250"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            limits:
              memory: 384Mi
            requests:
              # Login derives scrypt at N=16384 (~16 MB and real CPU per verify),
              # so a 1m request left the pod scheduled with essentially no
              # guaranteed CPU and logins stalling under node contention. No CPU
              # limit on purpose: throttling a scrypt verify only makes the
              # login slower for everyone sharing the pod.
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      # Deliberately empty, pending a maintainer decision (HARDENING_STATUS.md
      # D4): docker-entrypoint.sh starts as root to fix volume permissions
      # before dropping to UID 1000, which is incompatible with
      # `runAsNonRoot: true`. OpenShift's SCC constrains the pod anyway; plain
      # Kubernetes does not, so this is a known gap, not an oversight.
      securityContext: {}
      schedulerName: default-scheduler
