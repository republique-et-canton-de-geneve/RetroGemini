apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrogemini
  labels:
    app: retrogemini
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: retrogemini
  template:
    metadata:
      labels:
        app: retrogemini
    spec:
      containers:
        - name: container
          # This line is rewritten by .github/workflows/docker-deploy.yml on every
          # deployment (sed + auto-commit), so it names the last tag pushed to the
          # registry. It had drifted 17 majors behind VERSION, i.e. it advertised
          # an image predating many user-visible releases;
          # __tests__/deploymentManifestParity.test.ts now fails when the majors
          # diverge again. Overlays may retag (see k8s/overlays/dev).
          image: jpfroud/retrogemini:29.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SUPER_ADMIN_PASSWORD
            # Stable token-signing secret. Optional so existing secrets still
            # start; if absent, tokens use a process-local random secret.
            - name: SESSION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SESSION_TOKEN_SECRET
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_HOST
            # SMTP configuration (optional - for email invitations and password reset)
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PASS
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: FROM_EMAIL
                  optional: true
            # Wi-Fi QR code configuration (optional - for air-gapped deployments)
            - name: WIFI_SSID
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_SSID
                  optional: true
            - name: WIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_PASSWORD
                  optional: true
            # Backup configuration (plain values - safe to re-apply)
            - name: BACKUP_ENABLED
              value: "true"
            - name: BACKUP_INTERVAL_HOURS
              value: "24"
            - name: BACKUP_MAX_COUNT
              value: "7"
            - name: BACKUP_ON_STARTUP
              value: "true"
            # Restore archive limits (MB). RESTORE_MAX_BODY_MB caps the uploaded
            # compressed body; RESTORE_MAX_DECOMPRESSED_MB caps expanded JSON.
            - name: RESTORE_MAX_BODY_MB
              value: "128"
            - name: RESTORE_MAX_DECOMPRESSED_MB
              value: "512"
            # Rejected team-create / restore-session credentials allowed per IP
            # per 15 min. Only 401 responses count, so ordinary use — including
            # reloading the app repeatedly, which re-calls restore-session every
            # time — can never consume this budget. Raise it only if you have a
            # reason to tolerate more failed credential attempts.
            - name: AUTH_RATE_LIMIT_MAX
              value: "5"
            # Canonical public URL, used to build the links the server mails.
            # No value here on purpose: it is your Route/Ingress hostname, which
            # differs between dev and prod and which OpenShift generates, so this
            # base manifest cannot know it. Supply it once per environment with
            # the ConfigMap in k8s/config-templates/ (a single command that reads
            # the hostname from the Route itself - see k8s/README.md); like the
            # Secrets, it lives outside the kustomization so `apply -k` never
            # overwrites it.
            #
            # optional: true is load-bearing. An environment without the
            # ConfigMap must still start: it simply cannot send password-reset
            # email (that route answers 501 rather than trust the
            # caller-controlled Host header, since its mail carries a live
            # token). Invitations and everything else work regardless.
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: retrogemini-config
                  key: PUBLIC_BASE_URL
                  optional: true
            # Scaling / performance tuning (optional - values below are the
            # built-in code defaults; adjust per environment as you grow).
            # PG_POOL_MAX is PER POD: keep (replicas x PG_POOL_MAX) safely below
            # the PostgreSQL max_connections (default 100). Here 2 x 10 = 20.
            - name: PG_POOL_MAX
              value: "10"
            # Max live sessions cached in memory per pod (bounds memory only;
            # session state is always recoverable from the database).
            - name: SESSION_CACHE_MAX
              value: "500"
            # Max Socket.IO message size in bytes (1 MB) - caps one session update.
            - name: SOCKET_MAX_BUFFER_SIZE
              value: "1000000"
            # Per-socket update-session flood throttle (token bucket).
            # DELIBERATELY OFF (audit H11 / decision D17, 2026-08-06). This
            # deployment is internal and not reachable from the internet, so the
            # attacker the throttle guards against does not exist here; what is
            # left is a looping client, which is rare, while the throttle's cost
            # (a heal round-trip on a legitimate burst) would be paid by real
            # facilitators. Do not enable it "to be safe" - that is a change
            # with a certain cost against an uncertain benefit.
            #
            # WHEN TO ENABLE: if this app is ever exposed beyond the internal
            # network, or if a runaway client is actually observed saturating
            # the DB write path. Then set 20 (timer sync is ~1/s per client, so
            # that leaves an order of magnitude of headroom) with the burst at
            # 2x, roll it to staging first, and watch for heal round-trips.
            # A throttled write is healed with authoritative state and re-sent,
            # never dropped, so too tight costs a round-trip, not a user action.
            - name: SOCKET_UPDATE_RATE
              value: "0"
            - name: SOCKET_UPDATE_BURST
              value: "40"
            # Min interval (ms) between lastConnectionDate refreshes on join
            # (5 min) - avoids a write storm when a whole session reconnects.
            - name: LAST_CONNECTION_DEBOUNCE_MS
              value: "300000"
            # Debounce window (ms) for coalescing roster rebroadcasts. Caps a
            # reconnect stampede to one rebuild + broadcast per room per window
            # instead of one cross-pod fetchSockets() + broadcast per join
            # (audit R28). Never drops a user action; set to 0 to disable.
            - name: ROSTER_BROADCAST_DEBOUNCE_MS
              value: "250"
          # Audit H7.2 / decision D4: the container half of the context. The app
          # is a Node process listening on 8080 — it needs no Linux capability
          # and never escalates privileges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            limits:
              memory: 384Mi
            requests:
              # 1m is deliberate: it is what the OpenShift administrators asked
              # for on this cluster, and it works in practice. Do not "fix" it
              # upwards on the theory that the scrypt login path needs a bigger
              # guaranteed share — that was proposed once (audit H7.3) and
              # rejected by the people who run the cluster. No CPU limit either,
              # so the pod can burst freely above this request.
              cpu: 1m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      # Audit H7.2 / decision D4. This used to be `{}`, i.e. plain Kubernetes
      # enforced nothing at all, on the theory that docker-entrypoint.sh must
      # start as root to chown a mounted volume. It does not have to here: this
      # Deployment mounts NO volume (it runs on PostgreSQL), and the entrypoint
      # already handles a non-root start — it skips the chown and execs the
      # command directly. Standalone Docker users who do mount /data for SQLite
      # keep the root entrypoint and are unaffected by this pod spec.
      #
      # readOnlyRootFilesystem is deliberately NOT set: it is the one field with
      # a real failure mode (a SQLite deployment writing /data, anything needing
      # /tmp) and no gain for this configuration.
      #
      # OpenShift note: the overlay clears runAsUser/runAsGroup/fsGroup, because
      # the restricted SCC allocates the project its own UID range and REJECTS a
      # pod that names a UID outside it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      schedulerName: default-scheduler
