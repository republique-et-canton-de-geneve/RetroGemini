apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrogemini
  labels:
    app: retrogemini
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: retrogemini
  template:
    metadata:
      labels:
        app: retrogemini
    spec:
      containers:
        - name: container
          image: jpfroud/retrogemini:10.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SUPER_ADMIN_PASSWORD
            # Stable token-signing secret (optional for compatibility with
            # existing secrets; falls back to SUPER_ADMIN_PASSWORD if missing).
            - name: SESSION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: SESSION_TOKEN_SECRET
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-super-admin
                  key: POSTGRES_HOST
            # SMTP configuration (optional - for email invitations and password reset)
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: SMTP_PASS
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retrogemini-smtp
                  key: FROM_EMAIL
                  optional: true
            # Wi-Fi QR code configuration (optional - for air-gapped deployments)
            - name: WIFI_SSID
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_SSID
                  optional: true
            - name: WIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retrogemini-wifi
                  key: WIFI_PASSWORD
                  optional: true
            # Backup configuration (plain values - safe to re-apply)
            - name: BACKUP_ENABLED
              value: "true"
            - name: BACKUP_INTERVAL_HOURS
              value: "24"
            - name: BACKUP_MAX_COUNT
              value: "7"
            - name: BACKUP_ON_STARTUP
              value: "true"
            # Restore archive limits (MB). RESTORE_MAX_BODY_MB caps the uploaded
            # compressed body; RESTORE_MAX_DECOMPRESSED_MB caps expanded JSON.
            - name: RESTORE_MAX_BODY_MB
              value: "128"
            - name: RESTORE_MAX_DECOMPRESSED_MB
              value: "512"
            # Scaling / performance tuning (optional - values below are the
            # built-in code defaults; adjust per environment as you grow).
            # PG_POOL_MAX is PER POD: keep (replicas x PG_POOL_MAX) safely below
            # the PostgreSQL max_connections (default 100). Here 2 x 10 = 20.
            - name: PG_POOL_MAX
              value: "10"
            # Max live sessions cached in memory per pod (bounds memory only;
            # session state is always recoverable from the database).
            - name: SESSION_CACHE_MAX
              value: "500"
            # Max Socket.IO message size in bytes (1 MB) - caps one session update.
            - name: SOCKET_MAX_BUFFER_SIZE
              value: "1000000"
            # Min interval (ms) between lastConnectionDate refreshes on join
            # (5 min) - avoids a write storm when a whole session reconnects.
            - name: LAST_CONNECTION_DEBOUNCE_MS
              value: "300000"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 1m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
