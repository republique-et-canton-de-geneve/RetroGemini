# Audit H7.2 / decision D4 — hand the UID back to OpenShift.
#
# k8s/base pins runAsUser/runAsGroup/fsGroup on both pods so that a plain
# Kubernetes cluster, which enforces nothing on its own, still runs them as a
# known non-root user. OpenShift works the other way round: the restricted SCC
# allocates every project a UID range (e.g. 1000700000-1000709999) and injects a
# value from it. A pod that names 1000 (or 70) is not merely overridden, it is
# REJECTED at admission — "unable to validate against any security context
# constraint" — and the deployment never starts.
#
# Setting a key to null in a strategic-merge patch is how kustomize deletes it,
# so this removes the three UID/GID fields and leaves everything else in place:
# runAsNonRoot, the seccomp profile, the dropped capabilities and
# allowPrivilegeEscalation: false all still apply (and all satisfy restricted-v2,
# which imposes them anyway).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrogemini
spec:
  template:
    spec:
      securityContext:
        runAsUser: null
        runAsGroup: null
        fsGroup: null
---
# Audit H40 — the same, for the database pod.
#
# The base pins 70 because that is the UID `postgres:15-alpine` gives its
# `postgres` account. This overlay replaces that image with the Red Hat build
# (postgresql-image.patch.yaml), which is written for exactly this model: it adds
# the SCC-assigned UID to /etc/passwd through nss_wrapper at start-up, so initdb
# finds a passwd entry for a UID no manifest could have predicted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-retrogemini
spec:
  template:
    spec:
      securityContext:
        runAsUser: null
        runAsGroup: null
        fsGroup: null
