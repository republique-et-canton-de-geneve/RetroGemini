apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: team-retrospective-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

# No resource patch here on purpose. This overlay used to replace the replica
# count and the memory request/limit, but it targeted a Deployment name that no
# longer exists (`team-retrospective`), so kustomize failed the build and the
# patch had never been applied. Its values had also drifted *below* base — a
# 256Mi limit against base's 384Mi — so repairing the target would have silently
# tightened production memory instead of restoring an intended override. Base
# already ships the production shape (2 replicas, 128Mi request / 384Mi limit);
# add a patch back here only for a value production genuinely needs to differ on.

# The image tag comes from base, which is pinned to the repository's VERSION.
