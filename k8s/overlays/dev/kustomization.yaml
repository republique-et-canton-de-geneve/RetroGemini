apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: team-retrospective-dev

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

# Dev-specific patches. The target name must match the base Deployment
# (`retrogemini`): kustomize fails the whole build on a target that matches
# nothing, which is how this overlay silently stopped working.
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: retrogemini

# `images[].name` must match the image *as written in base*, image name only.
# Unlike a patch target, a name that matches nothing fails silently and the
# overlay ships the base tag.
images:
  - name: jpfroud/retrogemini
    newTag: dev
