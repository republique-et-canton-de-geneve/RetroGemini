apiVersion: v1
kind: Secret
metadata:
  name: retrogemini-super-admin
  labels:
    app: retrogemini
type: Opaque
stringData:
  POSTGRES_DB: retrogemini
  POSTGRES_HOST: postgresql
  POSTGRES_PASSWORD: change-me
  POSTGRES_USER: retrogemini
  SUPER_ADMIN_PASSWORD: change-me
  # Replace with a long random value (openssl rand -base64 48), the same on
  # every pod: this example is public, so a team cannot store a Jira token under
  # it. It seals the teams' Jira tokens: keep it apart from database dumps.
  SESSION_TOKEN_SECRET: change-me-to-a-long-random-secret
