name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master, develop ]

# Least privilege (audit H47). Every job in this workflow reads the repository,
# runs `npm ci` and uploads artifacts; none of it writes anything back to
# GitHub. Declaring that here is what stops the workflow inheriting the
# repository's *default* `GITHUB_TOKEN` — a setting that lives in repository
# administration and is therefore invisible in the pull request that would
# widen it. It matters most on this workflow and on `e2e.yml` precisely because
# they are the two that run `npm ci`, i.e. the two that execute dependency
# lifecycle scripts, in a repository that deploys to production from its own
# workflows.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Decision D5: this job used to be gated to workflow_dispatch and Dependabot,
    # so it never ran on a human pull request — while AGENTS.md instructed branch
    # protection to require it, a contradiction that left ~5 000 statements of
    # React with no automated gate at all (unit coverage there is ~37%, and the
    # components are deliberately owned by e2e). The suite runs in ~3.5 minutes
    # serially since the announcement-modal race was fixed (audit H18), with one
    # retry in CI, so the cost of running it on every PR is small and the gap it
    # closes is the largest one left.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Audit H36 / decision D14. The suite above loads the app from Vite on
      # :5173, so it never sees a header set by server.js — an enforcing CSP
      # that blocks the real bundle would leave it green while production
      # renders blank. This job builds the frontend and drives it from
      # server.js, which is the only configuration where the policy is
      # actually enforced by the browser.
      - name: Run production CSP gate
        run: npm run test:e2e:prod

      - name: List Playwright artifacts
        if: always()
        run: |
          echo '== playwright-report =='
          find playwright-report -maxdepth 3 -type f | sort || true
          echo '== test-results videos =='
          find test-results -type f -name '*.webm' | sort || true

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
