name: Deploy Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (leave empty to use VERSION file)'
        required: false
        default: ''
      push_latest:
        description: 'Also push as latest tag'
        required: false
        type: boolean
        default: true

jobs:
  dockerhub-deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Audit H17 / decision D7: read-only. `contents: write` was requested solely
    # for an "Update k8s manifests" step that auto-committed the image retag —
    # a step that never executed once in 209 runs, and that would have pushed to
    # whatever branch the deploy was dispatched from (feature branches included).
    # It was removed rather than repaired: the retag belongs to the major bump
    # that earns it, and `__tests__/deploymentManifestParity.test.ts` already
    # fails a pull request whose manifest tag has fallen behind VERSION's major.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version from VERSION file: $VERSION"

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
            echo "Using manually specified tag: $TAG"
          else
            TAG="${{ steps.version.outputs.version }}"
            echo "Using VERSION file tag: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          if [ "${{ inputs.push_latest }}" == "true" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_REPOSITORY }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Will push tags: $TAGS"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**K8s manifests:** not touched by this workflow. Retag \`k8s/base/deployment.yaml\` in the pull request that bumps the major (checked by \`__tests__/deploymentManifestParity.test.ts\`)." >> $GITHUB_STEP_SUMMARY
