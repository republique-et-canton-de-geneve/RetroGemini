name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Publish version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to create."
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RetroGemini $VERSION" \
              --generate-notes
          fi

      # The SBOM (audit H47). An air-gapped operator installs this image inside a
      # network that cannot query npm, so "what is actually in it" has to travel
      # *with* the release or it is not knowable at install time. `--omit dev`
      # is what makes the document honest: the production image stage runs
      # `npm ci --omit=dev`, so a full-tree SBOM would list hundreds of build
      # dependencies that never ship and hide the ones that do.
      #
      # This is the dependency half only. The image half — `--sbom=true` /
      # `--provenance=true` attestations pushed alongside the image — is
      # deliberately not taken here; see HARDENING_STATUS.md H47 for why (it
      # changes the production publish path, and nothing in the agent container
      # or in CI can verify that the registry mirror accepts the attestation
      # index before a release depends on it).
      - name: Set up Node.js for the SBOM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Generate the production dependency SBOM (CycloneDX)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci --ignore-scripts --no-audit
          npm sbom --sbom-format cyclonedx --omit dev > "retrogemini-$VERSION-sbom.cdx.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "retrogemini-$VERSION-sbom.cdx.json"

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release upload "$VERSION" "retrogemini-$VERSION-sbom.cdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Only inputs `docker-deploy.yml` declares may be passed: the dispatch API
      # rejects the whole call with `HTTP 422: Unexpected inputs provided` for an
      # unknown one, so an input removed there and left here does not degrade —
      # it dispatches nothing at all. That is what `update_k8s_manifests` did
      # from the moment decision D7 deleted it (2026-08-03) until it was removed
      # here: all three VERSION-bump merges since then created their GitHub
      # release and then failed this step, so the automatic image publish had
      # been dead for two days and only manual dispatches were still shipping
      # images. `__tests__/deploymentManifestParity.test.ts` now checks the two
      # sides against each other.
      - name: Publish matching Docker image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh workflow run docker-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f image_tag="$VERSION" \
            -f push_latest=true
