name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Publish version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to create."
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RetroGemini $VERSION" \
              --generate-notes
          fi

      # Only inputs `docker-deploy.yml` declares may be passed: the dispatch API
      # rejects the whole call with `HTTP 422: Unexpected inputs provided` for an
      # unknown one, so an input removed there and left here does not degrade —
      # it dispatches nothing at all. That is what `update_k8s_manifests` did
      # from the moment decision D7 deleted it (2026-08-03) until it was removed
      # here: all three VERSION-bump merges since then created their GitHub
      # release and then failed this step, so the automatic image publish had
      # been dead for two days and only manual dispatches were still shipping
      # images. `__tests__/deploymentManifestParity.test.ts` now checks the two
      # sides against each other.
      #
      # The image is built from the release's own tag, the commit the release
      # points at, never from a branch. It used `--ref main`, which builds
      # whatever main holds when the build starts: run by hand from a branch to
      # release that branch, this workflow created the branch's release and
      # then published main's code under the branch's version and as `latest`;
      # and a second merge within the build's minute was published under the
      # first one's version. A release that already exists (created from its
      # branch before the merge) is rebuilt from its tag: the same commit, but
      # a new build, which may take a newer base image and newer Alpine
      # packages, and the version tag and `latest` move to it.
      - name: Publish matching Docker image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh workflow run docker-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" \
            -f image_tag="$VERSION" \
            -f push_latest=true

      # The SBOM (audit H47). An air-gapped operator installs this image inside a
      # network that cannot query npm, so "what is actually in it" has to travel
      # *with* the release or it is not knowable at install time. `--omit dev`
      # is what makes the document honest: the production image stage runs
      # `npm ci --omit=dev`, so a full-tree SBOM would list hundreds of build
      # dependencies that never ship and hide the ones that do.
      #
      # **Last on purpose.** These steps run after the image dispatch because a
      # failure here must not cost the release its image: placed between "create
      # release" and "publish image", an `npm ci` blip or an npm registry outage
      # would fail the job with the release already created and the image never
      # built — turning a missing SBOM into a missing deployment. Ordered this
      # way the worst case is a release whose SBOM is attached by a re-run.
      #
      # This is the dependency half only. The image half — `--sbom=true` /
      # `--provenance=true` attestations pushed alongside the image — is
      # deliberately not taken here; see HARDENING_STATUS.md H47 for why (it
      # changes the production publish path, and nothing in the agent container
      # or in CI can verify that the registry mirror accepts the attestation
      # index before a release depends on it).
      #
      # The SBOM describes the release's commit, the one the image is built
      # from, not the commit this run started from: the two differ when the
      # release already existed, and an SBOM of the merge commit would list
      # the dependency bumps main took since the release, which its image
      # does not contain.
      - name: Check out the release tag for the SBOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.value }}

      - name: Set up Node.js for the SBOM
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Generate the production dependency SBOM (CycloneDX)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci --ignore-scripts --no-audit
          npm sbom --sbom-format cyclonedx --omit dev > "retrogemini-$VERSION-sbom.cdx.json"
          # `npm sbom` names the root component after package.json, which has
          # read 1.1.0 since the repo began — VERSION is the release identity,
          # and an inventory scanner reads metadata.component, not the filename.
          # Without this every release would describe itself identically.
          node scripts/stampSbom.mjs "retrogemini-$VERSION-sbom.cdx.json" "$VERSION"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "retrogemini-$VERSION-sbom.cdx.json"

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release upload "$VERSION" "retrogemini-$VERSION-sbom.cdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
