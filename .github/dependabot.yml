version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    # Limit to security updates only (comment out to get all updates)
    open-pull-requests-limit: 10
    reviewers:
      - "uSpreadIt"
    assignees:
      - "uSpreadIt"
    commit-message:
      prefix: "npm"
      include: "scope"
    # Group minor and patch updates together
    groups:
      # vitest pins its companion packages to an *exact* core version
      # (`@vitest/coverage-v8@5.0.0` declares `peer vitest@"5.0.0"`), so a bump
      # that arrives one package at a time can never install: `npm ci` fails
      # with ERESOLVE for as long as the versions differ, and every job in
      # every workflow goes red behind it. This group therefore covers majors
      # too — which the two groups below deliberately do not.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Always allow security updates
    labels:
      - "dependencies"
      - "security"
    # Ignore specific dependencies if needed
    ignore:
      # Hold TypeScript on the 6.x line: typescript-eslint has no release
      # (not even canary) that supports the TypeScript 7 API — the plugin throws
      # "typescript-eslint does not support TS 7.0" at load, which breaks the
      # lint job. Revisit once typescript-eslint ships TS 7 support
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "uSpreadIt"
    assignees:
      - "uSpreadIt"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # `init`, `autobuild`, `analyze` and `upload-sarif` come from one
      # repository and share one config file, which a reader refuses when it was
      # written by another major ("Loaded a configuration file for version 'A',
      # but running version 'B'"). Ungrouped, Dependabot opens one PR per
      # sub-action: each is individually mergeable and collectively breaks the
      # workflow -- and it breaks it *silently*, because `analyze` carries
      # `continue-on-error: true`, so a mismatched CodeQL run uploads a failed
      # execution, produces no alerts, and still reports a green job. Group them
      # so the family can only move as one.
      # `__tests__/deploymentManifestParity.test.ts` asserts the revisions agree,
      # which is what catches a hand-edit or a partial revert this cannot.
      codeql-action:
        patterns:
          - "github/codeql-action*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "uSpreadIt"
    assignees:
      - "uSpreadIt"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
